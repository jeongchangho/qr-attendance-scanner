
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1769e0">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <title>QR스캐너</title>

  <style>

#splashScreen{
  position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;
  align-items:center;justify-content:center;background:#e4f1ff;color:#24527a;
  opacity:1;transition:opacity .25s ease;
}
#splashScreen.hide{opacity:0;pointer-events:none}
.splash-title{font-size:clamp(30px,6vw,46px);font-weight:800;letter-spacing:.04em}
.splash-subtitle{margin-top:12px;font-size:14px;color:#527797;letter-spacing:.08em;text-align:center}
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #101827;
      color: #f8fafc;
      font-family: system-ui, sans-serif;
    }

    main {
      width: 100%;
      max-width: 640px;
      margin: auto;
      padding: 20px;
    }

    h1 {
      font-size: 1.4rem;
      text-align: center;
    }

    .panel {
      background: #1e293b;
      padding: 15px;
      border-radius: 15px;
      margin: 14px 0;
    }

    input,
    button {
      width: 100%;
      padding: 13px;
      border: 0;
      border-radius: 10px;
      margin: 7px 0;
      font-size: 1rem;
    }

    input {
      background: #fff;
      color: #111827;
    }

    button {
      background: #7dd3fc;
      color: #082f49;
      font-weight: 700;
      cursor: pointer;
    }

    button.stop {
      background: #475569;
      color: white;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }


    /* 오른쪽 상단 전체화면 버튼 */
    .fullscreen-toggle {
      position: fixed;
      top: calc(10px + env(safe-area-inset-top));
      right: 12px;
      z-index: 1100;
      width: 42px;
      height: 42px;
      padding: 0;
      margin: 0;
      border-radius: 12px;
      background: rgba(51, 65, 85, .92);
      color: #f8fafc;
      font-size: 24px;
      line-height: 1;
      box-shadow: 0 2px 10px rgba(0,0,0,.28);
    }

    .fullscreen-toggle:focus-visible {
      outline: 2px solid #7dd3fc;
      outline-offset: 3px;
    }

    /* 전체화면 중에도 버튼을 화면 위에 유지 */
    :fullscreen .fullscreen-toggle {
      position: fixed;
    }

    /* 카메라 종료 버튼 바로 아래의 Apps Script 주소 접기/펼치기 */
    .endpoint-drawer {
      position: static;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      padding: 5px 0 0;
      pointer-events: auto;
    }

    .endpoint-toggle {
      width: 42px;
      min-height: 28px;
      padding: 2px 8px;
      margin: 0;
      border-radius: 14px;
      background: #334155;
      color: #e2e8f0;
      font-size: 19px;
      line-height: 1;
      box-shadow: 0 2px 10px rgba(0,0,0,.25);
    }

    .endpoint-panel {
      width: 100%;
      max-height: 0;
      overflow: hidden;
      opacity: 0;
      transform: translateY(-8px);
      margin-top: 0;
      padding: 0 12px;
      border: 1px solid transparent;
      border-radius: 12px;
      background: #1e293b;
      box-shadow: 0 4px 18px rgba(0,0,0,.25);
      transition:
        max-height .32s ease,
        opacity .25s ease,
        transform .32s ease,
        margin-top .32s ease,
        padding .32s ease;
    }

    .endpoint-panel.open {
      max-height: 130px;
      opacity: 1;
      transform: translateY(0);
      margin-top: 7px;
      padding: 12px;
      border-color: #475569;
    }

    .endpoint-panel label {
      display: block;
      margin-bottom: 5px;
      font-size: .85rem;
      color: #cbd5e1;
    }

    .endpoint-panel input {
      width: 100%;
      margin: 0;
      padding: 10px;
      font-size: .85rem;
    }

    /* 전체화면에서는 세로 공간을 화면에 맞춰 사용 */
    html, body {
      min-height: 100%;
    }

    body:fullscreen {
      width: 100%;
      height: 100%;
      min-height: 100%;
      overflow: auto;
    }

    body:fullscreen main {
      width: 100%;
      max-width: none;
      min-height: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: max(12px, env(safe-area-inset-top)) 14px max(12px, env(safe-area-inset-bottom));
    }

    body:fullscreen main > h1 {
      flex: 0 0 auto;
      margin: 8px 0 12px;
    }

    body:fullscreen .panel {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
      margin: 0;
    }

    body:fullscreen .camera-wrap {
      flex: 1 1 auto;
      min-height: 180px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    body:fullscreen video {
      width: 100%;
      height: 100%;
      aspect-ratio: auto;
      object-fit: contain;
    }

    body:fullscreen .status {
      flex: 0 0 auto;
    }

    body:fullscreen .endpoint-panel.open {
      max-height: 130px;
    }

    /* 태블릿 가로 화면: 조작부는 필요한 높이만 사용하고 카메라 영역을 넓게 */
    @media (orientation: landscape) {
      body:fullscreen {
        height: 100dvh;
        min-height: 100dvh;
        overflow: hidden;
      }

      body:fullscreen main {
        height: 100dvh;
        min-height: 0;
        padding: max(6px, env(safe-area-inset-top)) 14px max(6px, env(safe-area-inset-bottom));
      }

      body:fullscreen main > h1 {
        margin: 2px 0 6px;
        font-size: 1.15rem;
      }

      body:fullscreen .panel {
        flex: 1 1 0;
        min-height: 0;
        padding: 10px;
        gap: 4px;
      }

      body:fullscreen .camera-wrap {
        flex: 1 1 0;
        min-height: 0;
        height: 0;
        margin-top: 2px;
      }

      body:fullscreen video {
        width: 100%;
        height: 100%;
        aspect-ratio: auto;
        object-fit: cover;
        /* 가로 화면에서는 좌우를 조금 확대해 양쪽 가장자리를 잘라냅니다. */
        transform: scaleX(-1) scale(1.14, 1);
        transform-origin: center center;
      }

      body:fullscreen .status {
        min-height: 48px;
        padding: 8px 12px;
        margin: 4px 0;
      }

      body:fullscreen .panel > button {
        flex: 0 0 42px;
        min-height: 42px;
        padding: 8px 12px;
        margin: 3px 0;
      }

      body:fullscreen .endpoint-drawer {
        flex: 0 0 auto;
        padding-top: 2px;
      }

      body:fullscreen .endpoint-toggle {
        min-height: 26px;
      }
    }

    /* 카메라 영역 */
    .camera-wrap {
      position: relative;
      width: 100%;
      margin-top: 10px;
      overflow: hidden;
      isolation: isolate;
      border-radius: 12px;
      background: #000;
    }

    video {
  display: block;
  width: 100%;
  aspect-ratio: 4 / 3;
  object-fit: cover;
  background: #000;
  transform: scaleX(-1);
}

    /* 출석 결과 알림창 */
    .notice {
      position: absolute;
      left: 16px;
      right: 16px;
      bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 130px;
      padding: 20px 14px;
      border-radius: 16px;
      text-align: center;
      z-index: 20;
      opacity: 0;
      visibility: hidden;
      transform: translateY(35px);
      transition:
        opacity 0.25s ease,
        transform 0.25s ease,
        visibility 0.25s ease;
      pointer-events: none;
    }

    .notice.show {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .notice.success {
      background: rgba(22, 163, 74, 0.96);
      color: #fff;
    }

    .notice.duplicate {
      background: rgba(202, 138, 4, 0.97);
      color: #fff;
    }

    .notice.error {
      background: rgba(220, 38, 38, 0.96);
      color: #fff;
    }

    .notice-content {
      width: 100%;
      overflow-wrap: anywhere;
    }

    .notice-title {
      font-size: 1.7rem;
      font-weight: 800;
      margin-bottom: 12px;
    }

    .notice-name {
      font-size: 1.35rem;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .notice-message {
      font-size: 1.15rem;
      line-height: 1.7;
      font-weight: 600;
      white-space: pre-line;
    }

    .notice-date {
      font-size: 0.95rem;
      margin-top: 10px;
      opacity: 0.9;
    }

    /* 출석 상태 안내창 */
    .status {
      display: block;
      width: 100%;
      min-height: 75px;
      white-space: pre-wrap;
      background: #0f172a;
      padding: 15px;
      border-radius: 10px;
      line-height: 1.6;
      margin: 10px 0;
    }

    .good {
      color: #86efac;
    }

    .bad {
      color: #fca5a5;
    }
  </style>
</head>

<body>
<button
  id="fullscreenToggle"
  class="fullscreen-toggle"
  type="button"
  aria-label="전체화면 시작"
  title="전체화면"
>⛶</button>

<section id="splashScreen" aria-label="순천지역WM 시작 화면"><div class="splash-title">순천지역WM</div><div class="splash-subtitle">하나님과 동행하는 순천지역WM</div></section>

<main>

  <h1>QR스캐너</h1>


  <section class="panel">



    <!-- 1. 카메라 영상 -->
    <div class="camera-wrap">

      <video
        id="video"
        autoplay
        muted
        playsinline
      ></video>

      <!-- 출석 결과 알림: 영상 위에 표시 -->
      <div id="notice" class="notice">

        <div class="notice-content">

          <div id="noticeTitle" class="notice-title"></div>

          <div id="noticeName" class="notice-name"></div>

          <div id="noticeMessage" class="notice-message"></div>

          <div id="noticeDate" class="notice-date"></div>

        </div>

      </div>

    </div>

    <!-- 2. 출석 상태 안내: 카메라 바로 아래 -->
    <p id="status" class="status">
      웹앱 URL을 확인한 뒤 전면 카메라를 시작하세요.
    </p>

    <!-- 3. 전면 카메라 시작 버튼 -->
    <button id="start">
      전면 카메라 시작
    </button>

    <!-- 4. 카메라 종료 버튼 -->
    <button id="stop" class="stop" disabled>
      카메라 종료
    </button><!-- Apps Script 주소는 기본적으로 숨기고, 아래 화살표로 열 수 있습니다. -->
<div class="endpoint-drawer">
  <button
    id="endpointToggle"
    class="endpoint-toggle"
    type="button"
    aria-label="웹앱 주소 표시"
    aria-expanded="false"
    aria-controls="endpointPanel"
  >⌃</button>

  <div id="endpointPanel" class="endpoint-panel">
    <label for="endpoint">Apps Script 웹앱 URL</label>
    <input
      id="endpoint"
      type="url"
      value="https://script.google.com/macros/s/AKfycbx6HK7qLTZGvJVyguvH0qgsaJXEJhHFhX-axeo7ZJqdf9lztk8tl4xMm1YP1b2qGb7A/exec"
      placeholder="Apps Script 웹앱 URL"
    >
  </div>
</div>

  </section>

</main>


<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

<script>


/* =====================================
   전체화면 전환
===================================== */

const fullscreenToggle = document.querySelector('#fullscreenToggle');

function updateFullscreenButton() {
  const active = Boolean(document.fullscreenElement);
  fullscreenToggle.textContent = active ? '×' : '⛶';
  fullscreenToggle.setAttribute(
    'aria-label',
    active ? '전체화면 종료' : '전체화면 시작'
  );
  fullscreenToggle.title = active ? '전체화면 종료' : '전체화면';
}

fullscreenToggle.addEventListener('click', async () => {
  try {
    if (!document.fullscreenElement) {
      const target = document.body;
      if (target.requestFullscreen) {
        await target.requestFullscreen();
      } else {
        say('이 브라우저에서는 전체화면 기능을 지원하지 않습니다.', 'bad');
      }
    } else if (document.exitFullscreen) {
      await document.exitFullscreen();
    }
  } catch (error) {
    say(
      '전체화면 전환을 지원하지 않거나 허용되지 않았습니다. 홈 화면에 설치한 앱에서 다시 시도해 주세요.',
      'bad'
    );
  }
});

document.addEventListener('fullscreenchange', updateFullscreenButton);
updateFullscreenButton();

/* =====================================
   Apps Script 주소 접기/펼치기
===================================== */

const endpointToggle = document.querySelector('#endpointToggle');
const endpointPanel = document.querySelector('#endpointPanel');

endpointToggle.textContent = '⌄';

endpointToggle.onclick = () => {
  const willOpen = !endpointPanel.classList.contains('open');
  endpointPanel.classList.toggle('open', willOpen);
  endpointToggle.textContent = willOpen ? '⌃' : '⌄';
  endpointToggle.setAttribute('aria-expanded', String(willOpen));
  endpointToggle.setAttribute(
    'aria-label',
    willOpen ? '웹앱 주소 숨기기' : '웹앱 주소 표시'
  );
};

/* =====================================
   출석 메시지
===================================== */

const MESSAGES = {
  successTitle: '출석 완료!',
  successMessage: '복 많이 받으세요!\n출석이 완료되었습니다.',

  duplicateTitle: '이미 출석했습니다',
  duplicateMessage: '오늘 출석 기록이 이미 있습니다.',

  errorTitle: '출석 확인 실패',
  unknownTitle: '확인할 수 없는 QR코드'
};


/* =====================================
   HTML 요소
===================================== */

const video = document.querySelector('#video');
const out = document.querySelector('#status');

const start = document.querySelector('#start');
const stop = document.querySelector('#stop');

const notice = document.querySelector('#notice');

const noticeTitle = document.querySelector('#noticeTitle');
const noticeName = document.querySelector('#noticeName');
const noticeMessage = document.querySelector('#noticeMessage');
const noticeDate = document.querySelector('#noticeDate');


/* =====================================
   변수
===================================== */

let stream = null;
let raf = 0;
let busy = false;
let last = '';
let lastAt = 0;
let noticeTimer = null;


const canvas = document.createElement('canvas');

const ctx = canvas.getContext('2d', {
  willReadFrequently: true
});


/* =====================================
   상태 안내
===================================== */


function say(message, color = '') {
  out.className = 'status ' + color;
  out.textContent = message;
}


/* =====================================
   출석 결과 알림
===================================== */

function showNotice(type, title, name, message, date) {

  clearTimeout(noticeTimer);

  notice.className = 'notice show ' + type;

  noticeTitle.textContent = title || '';
  noticeName.textContent = name || '';
  noticeMessage.textContent = message || '';
  noticeDate.textContent = date || '';

  if (type === 'success') {
    say('출석이 정상적으로 완료되었습니다.', 'good');

  } else if (type === 'duplicate') {
    say('오늘 이미 출석한 회원입니다.', 'good');

  } else {
    say(message || '출석 확인에 실패했습니다.', 'bad');
  }

  beep(type);
  vibrate(type);

  noticeTimer = setTimeout(() => {

    notice.classList.remove('show');

    say(
      '전면 카메라 실행 중…\nQR코드를 비춰주세요.',
      'good'
    );

  }, 2000);
}


/* =====================================
   소리 효과
===================================== */

function beep(type) {

  try {

    const AudioContextClass =
      window.AudioContext || window.webkitAudioContext;

    if (!AudioContextClass) return;

    const audio = new AudioContextClass();

    const oscillator = audio.createOscillator();
    const gain = audio.createGain();

    oscillator.connect(gain);
    gain.connect(audio.destination);

    if (type === 'success') {
      oscillator.frequency.value = 880;

    } else if (type === 'duplicate') {
      oscillator.frequency.value = 550;

    } else {
      oscillator.frequency.value = 250;
    }

    oscillator.type = 'sine';
    gain.gain.value = 0.15;

    oscillator.start();
    oscillator.stop(audio.currentTime + 0.18);

    oscillator.onended = () => {
      audio.close();
    };

  } catch (e) {
    // 소리 지원이 안 되는 경우 생략
  }
}


/* =====================================
   진동 효과
===================================== */

function vibrate(type) {

  if (!navigator.vibrate) return;

  if (type === 'success') {
    navigator.vibrate([150, 80, 150]);

  } else if (type === 'duplicate') {
    navigator.vibrate(250);

  } else {
    navigator.vibrate([400, 100, 400]);
  }
}


/* =====================================
   카메라 종료
===================================== */

function stopCamera() {

  cancelAnimationFrame(raf);

  if (stream) {
    stream.getTracks().forEach(track => track.stop());
  }

  stream = null;
  video.srcObject = null;

  start.disabled = false;
  stop.disabled = true;

  notice.classList.remove('show');

  say('카메라가 종료되었습니다.');
}


/* =====================================
   Apps Script 출석 전송
===================================== */

function send(token) {

  return new Promise((resolve, reject) => {

    const base =
      document.querySelector('#endpoint').value.trim();

    if (
      !/^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec$/.test(base)
    ) {
      reject(Error('Apps Script 웹앱 URL이 올바르지 않습니다.'));
      return;
    }

    const callbackName =
      'qrCb' + Date.now() +
      Math.floor(Math.random() * 10000);

    const script = document.createElement('script');

    const timer = setTimeout(() => {

      cleanup();

      reject(Error(
        '서버 응답 시간이 초과되었습니다.\n' +
        '배포 URL과 액세스 권한을 확인하세요.'
      ));

    }, 20000);


    function cleanup() {

      clearTimeout(timer);

      delete window[callbackName];

      script.remove();
    }


    window[callbackName] = result => {

      cleanup();

      resolve(result);
    };


    script.onerror = () => {

      cleanup();

      reject(Error('서버 연결에 실패했습니다.'));
    };


    script.src =
      base +
      '?action=scan&token=' +
      encodeURIComponent(token) +
      '&callback=' +
      callbackName;

    document.body.appendChild(script);

  });
}


/* =====================================
   QR 인식 후 출석 처리
===================================== */

async function handle(token) {

  if (busy) return;

  busy = true;
  last = token;
  lastAt = Date.now();

  say('출석 확인 중…');

  try {

    const r = await send(token);

    const name = r.name || '';
    const date = r.date || '';

    const message =
      r.message || '출석 결과를 확인했습니다.';


    // 중복 출석
    if (
      r.code === 'DUPLICATE' ||
      r.duplicate === true
    ) {

      showNotice(
        'duplicate',
        MESSAGES.duplicateTitle,
        name,
        MESSAGES.duplicateMessage,
        date
      );


    // 정상 출석
    } else if (r.ok) {

      showNotice(
        'success',
        MESSAGES.successTitle,
        name,
        MESSAGES.successMessage,
        date
      );


    // 미등록 QR
    } else if (r.code === 'NOT_FOUND') {

      showNotice(
        'error',
        MESSAGES.unknownTitle,
        '',
        message,
        ''
      );


    // 기타 오류 및 비활성 회원
    } else {

      showNotice(
        'error',
        MESSAGES.errorTitle,
        name,
        message,
        date
      );

    }

  } catch (e) {

    showNotice(
      'error',
      MESSAGES.errorTitle,
      '',
      e.message,
      ''
    );

  } finally {

    setTimeout(() => {
      busy = false;
    }, 2050);

  }
}


/* =====================================
   QR 스캔 반복 실행
===================================== */

function scan() {

  if (!stream) return;

  if (
    video.readyState >= 2 &&
    video.videoWidth &&
    window.jsQR
  ) {

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    ctx.drawImage(
      video,
      0,
      0,
      canvas.width,
      canvas.height
    );

    const frame = ctx.getImageData(
      0,
      0,
      canvas.width,
      canvas.height
    );

    const qr = jsQR(
      frame.data,
      frame.width,
      frame.height,
      {
        inversionAttempts: 'attemptBoth'
      }
    );

    if (
      qr &&
      qr.data &&
      !busy &&
      (
        qr.data !== last ||
        Date.now() - lastAt > 4000
      )
    ) {

      handle(qr.data);

    }

  }

  raf = requestAnimationFrame(scan);
}


/* =====================================
   전면 카메라 시작
===================================== */

start.onclick = async () => {

  try {

    if (!isSecureContext) {
      throw Error('HTTPS 주소로 접속해야 합니다.');
    }

    if (!navigator.mediaDevices?.getUserMedia) {
      throw Error('이 브라우저에서는 카메라를 사용할 수 없습니다.');
    }

    if (!window.jsQR) {
      throw Error('QR 라이브러리를 불러오지 못했습니다.');
    }

    stream = await navigator.mediaDevices.getUserMedia({

      audio: false,

      video: {
        facingMode: {
          exact: 'user'
        },

        width: {
          ideal: 1280
        },

        height: {
          ideal: 720
        }
      }

    });

    video.srcObject = stream;

    await video.play();

    start.disabled = true;
    stop.disabled = false;

    say(
      '전면 카메라 실행 중…\nQR코드를 비춰주세요.',
      'good'
    );

    scan();

  } catch (e) {

    say(
      '카메라 실행 실패: ' +
      e.name +
      '\n' +
      e.message,
      'bad'
    );

    stopCamera();
  }

};


/* =====================================
   카메라 종료 버튼
===================================== */

stop.onclick = stopCamera;


/* =====================================
   PWA 서비스 워커 등록
===================================== */

if ('serviceWorker' in navigator) {

  navigator.serviceWorker
    .register('./sw.js')
    .catch(() => {});

}

window.addEventListener('DOMContentLoaded',()=>{
  const splash=document.getElementById('splashScreen');
  window.setTimeout(()=>{
    splash.classList.add('hide');
    window.setTimeout(()=>{splash.style.display='none';},260);
  },1500);
});
</script>
