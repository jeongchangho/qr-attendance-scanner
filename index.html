<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><link rel="manifest" href="./manifest.webmanifest"><title>QR 출석 스캐너</title><style>
*{box-sizing:border-box}body{margin:0;background:#101827;color:#f8fafc;font-family:system-ui,sans-serif}main{max-width:640px;margin:auto;padding:20px}h1{font-size:1.4rem}input,button{width:100%;padding:13px;border:0;border-radius:10px;margin:7px 0;font-size:1rem}button{background:#7dd3fc;font-weight:700}button.stop{background:#475569;color:white}video{width:100%;aspect-ratio:4/3;object-fit:cover;background:#000;border-radius:12px}.panel{background:#1e293b;padding:15px;border-radius:15px;margin:14px 0}.status{white-space:pre-wrap;background:#0f172a;padding:12px;border-radius:10px}.good{color:#86efac}.bad{color:#fca5a5}
</style></head><body><main><h1>QR 출석 스캐너</h1><section class="panel"><label>Apps Script 웹앱 URL</label><input id="endpoint" placeholder="https://script.google.com/macros/s/.../exec"><video id="video" autoplay muted playsinline></video><button id="start">전면 카메라 시작</button><button id="stop" class="stop" disabled>카메라 종료</button><p id="status" class="status">웹앱 URL을 입력한 뒤 전면 카메라를 시작하세요.</p></section></main>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script><script>
const video=document.querySelector('#video'),out=document.querySelector('#status'),start=document.querySelector('#start'),stop=document.querySelector('#stop');let stream=null,raf=0,busy=false,last='',lastAt=0;const canvas=document.createElement('canvas'),ctx=canvas.getContext('2d',{willReadFrequently:true});
function say(s,c=''){out.className='status '+c;out.textContent=s;}
function stopCamera(){cancelAnimationFrame(raf);if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;video.srcObject=null;start.disabled=false;stop.disabled=true;}
function send(token){return new Promise((resolve,reject)=>{const base=document.querySelector('#endpoint').value.trim();if(!/^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec$/.test(base)){reject(Error('Apps Script 웹앱 URL이 올바르지 않습니다.'));return;}const cb='qrCb'+Date.now();const s=document.createElement('script');const timer=setTimeout(()=>{cleanup();reject(Error('서버 응답 시간 초과. 배포 URL과 액세스 권한을 확인하세요.'));},20000);function cleanup(){clearTimeout(timer);delete window[cb];s.remove();}window[cb]=v=>{cleanup();resolve(v);};s.onerror=()=>{cleanup();reject(Error('서버 연결에 실패했습니다.'));};s.src=base+'?action=scan&token='+encodeURIComponent(token)+'&callback='+cb;document.body.appendChild(s);});}
async function handle(token){if(busy)return;busy=true;last=token;lastAt=Date.now();say('출석 처리 중…');try{const r=await send(token);say((r.name?r.name+'\\n':'')+r.message+(r.date?'\\n'+r.date:''),r.ok?'good':'bad');}catch(e){say(e.message,'bad');}finally{setTimeout(()=>busy=false,1600);}}
function scan(){if(!stream)return;if(video.readyState>=2&&video.videoWidth&&window.jsQR){canvas.width=video.videoWidth;canvas.height=video.videoHeight;ctx.drawImage(video,0,0,canvas.width,canvas.height);const f=ctx.getImageData(0,0,canvas.width,canvas.height);const q=jsQR(f.data,f.width,f.height,{inversionAttempts:'attemptBoth'});if(q&&q.data&&!busy&&(q.data!==last||Date.now()-lastAt>4000))handle(q.data);}raf=requestAnimationFrame(scan);}
start.onclick=async()=>{try{if(!isSecureContext)throw Error('HTTPS 주소로 접속해야 합니다.');if(!window.jsQR)throw Error('QR 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인하세요.');stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{exact:'user'},width:{ideal:1280},height:{ideal:720}}});video.srcObject=stream;await video.play();start.disabled=true;stop.disabled=false;say('전면 카메라 실행 중. QR코드를 비춰주세요.','good');scan();}catch(e){say('카메라 실행 실패: '+e.name+'\\n'+e.message,'bad');stopCamera();}};stop.onclick=stopCamera;
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
