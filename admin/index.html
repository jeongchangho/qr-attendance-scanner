<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#123f91"><link rel="manifest" href="./manifest.webmanifest"><title>순천지역WM(관리자)</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:#17243a;font-family:system-ui,sans-serif}header{background:#123f91;color:white;padding:18px 20px;font-weight:800;font-size:20px}main{max-width:1000px;margin:auto;padding:16px}.card{background:white;border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 2px 12px #12254a12}input,select,button{font:inherit;padding:11px;border:1px solid #ccd5e3;border-radius:9px;margin:4px}button{background:#123f91;color:white;border:0;font-weight:700;cursor:pointer}.danger{background:#b42318}.muted{color:#68778c;font-size:13px}.hidden{display:none}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1;min-width:110px}table{border-collapse:collapse;width:100%;font-size:14px}td,th{padding:9px;border-bottom:1px solid #e5eaf1;text-align:left}th{background:#f4f7fb}.stat{font-size:25px;font-weight:800}#login{max-width:420px;margin:12vh auto}pre{white-space:pre-wrap;word-break:break-word}
</style></head><body><header>순천지역WM(관리자)</header><main>
<section id="login" class="card"><h2>공통 비밀번호 로그인</h2><input id="pw" type="password" placeholder="비밀번호" style="width:100%"><button onclick="login()" style="width:100%">로그인</button><p id="err" class="muted"></p></section>
<div id="app" class="hidden"><div class="row"><div class="card"><div class="muted">활성 회원</div><div id="total" class="stat">-</div></div><div class="card"><div class="muted">오늘 아침 출석</div><div id="today" class="stat">-</div></div><div class="card"><div class="muted">이번 달 평균</div><div id="avg" class="stat">-</div></div></div>
<div class="card"><h3>회원 등록</h3><div class="row"><input id="newname" placeholder="회원 이름"><button onclick="add()">회원 추가</button></div></div>
<div class="card"><h3>회원 관리</h3><div id="members">불러오는 중...</div></div>
<div class="card"><h3>수동 출석 수정</h3><div class="row"><select id="who"></select><input id="date" type="date"><select id="meeting"><option>아침</option><option>저녁</option></select><select id="status"><option>출석</option><option value="">출석 취소</option></select><button onclick="saveAttendance()">저장</button></div></div>
<div class="card"><h3>회원별 누적 통계</h3><div id="stats"></div></div><button onclick="logout()">로그아웃</button></div></main><script>
const API="https://script.google.com/macros/s/AKfycbz2k8Dw34vL5mKCmOoqiThpm37r8tbRAIriJGhGxd7f4A2-JMRezG-p21inEtBbhltK/exec";let session=localStorage.getItem("wm_session")||"";
function call(method,params={}){return new Promise((resolve,reject)=>{const cb="wmcb"+Date.now()+Math.floor(Math.random()*9999),s=document.createElement("script");let timer=setTimeout(()=>{clean();reject(Error("서버 응답 시간 초과"))},20000);function clean(){clearTimeout(timer);delete window[cb];s.remove()}window[cb]=r=>{clean();if(r.ok)resolve(r.data);else reject(Error(r.message||"요청 실패"))};s.onerror=()=>{clean();reject(Error("서버 연결 실패"))};s.src=API+"?action=api&method="+encodeURIComponent(method)+"&callback="+cb+"&"+new URLSearchParams(params);document.body.appendChild(s)})}
async function login(){try{const r=await call("login",{password:document.querySelector("#pw").value});session=r.token;localStorage.setItem("wm_session",session);show()}catch(e){document.querySelector("#err").textContent=e.message}}
function show(){document.querySelector("#login").classList.add("hidden");document.querySelector("#app").classList.remove("hidden");init()}
function req(m,p={}){return call(m,{...p,session})}
function logout(){localStorage.removeItem("wm_session");location.reload()}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
if(session)show();if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js");

async function init(){try{const d=await req("dashboard");total.textContent=d.totalMembers;today.textContent=d.todayMorningCount+"명 ("+d.todayMorningRate.toFixed(1)+"%)";avg.textContent=d.monthlyMorningRate.toFixed(1)+"%";date.value=d.today;await loadMembers();const st=await req("stats");stats.innerHTML="<table><tr><th>이름</th><th>상태</th><th>아침</th><th>저녁</th></tr>"+st.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.status)}</td><td>${x.morning}</td><td>${x.evening}</td></tr>`).join("")+"</table>"}catch(e){alert(e.message)}}
async function loadMembers(){const ms=await req("members");who.innerHTML=ms.filter(x=>x.status==="활성").map(x=>`<option value="${esc(x.token)}">${esc(x.name)}</option>`).join("");members.innerHTML="<table><tr><th>이름</th><th>상태</th><th>관리</th></tr>"+ms.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.status)}</td><td><button onclick="edit(${x.row},'${esc(x.name)}','${x.status}')">수정</button><button onclick="reissue(${x.row})">QR 재발급</button></td></tr>`).join("")+"</table>"}
async function add(){try{await req("addMember",{name:newname.value});newname.value="";await init()}catch(e){alert(e.message)}}
async function edit(row,name,status){const n=prompt("회원 이름",name);if(n===null)return;const st=confirm("활성 상태로 둘까요? 확인=활성 / 취소=비활성")?"활성":"비활성";try{await req("updateMember",{row,name:n,status:st});await loadMembers()}catch(e){alert(e.message)}}
async function reissue(row){if(!confirm("QR 토큰을 재발급할까요? 기존 QR은 사용할 수 없게 됩니다."))return;try{const r=await req("reissueToken",{row});alert(r.name+" 새 QR 토큰:\\n"+r.token);await loadMembers()}catch(e){alert(e.message)}}
async function saveAttendance(){try{await req("setAttendance",{token:who.value,date:date.value,meeting:meeting.value,status:status.value});alert("저장했습니다.");await init()}catch(e){alert(e.message)}}
</script></body></html>
