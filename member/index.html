<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1769e0"><link rel="manifest" href="./manifest.webmanifest"><title>순천지역WM(회원)</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:#17243a;font-family:system-ui,sans-serif}header{background:#1769e0;color:white;padding:18px 20px;font-weight:800;font-size:20px}main{max-width:1000px;margin:auto;padding:16px}.card{background:white;border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 2px 12px #12254a12}input,select,button{font:inherit;padding:11px;border:1px solid #ccd5e3;border-radius:9px;margin:4px}button{background:#1769e0;color:white;border:0;font-weight:700;cursor:pointer}.danger{background:#b42318}.muted{color:#68778c;font-size:13px}.hidden{display:none}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1;min-width:110px}table{border-collapse:collapse;width:100%;font-size:14px}td,th{padding:9px;border-bottom:1px solid #e5eaf1;text-align:left}th{background:#f4f7fb}.stat{font-size:25px;font-weight:800}#login{max-width:420px;margin:12vh auto}pre{white-space:pre-wrap;word-break:break-word}
</style></head><body><header>순천지역WM(회원)</header><main>
<section id="login" class="card"><h2>공통 비밀번호 로그인</h2><input id="pw" type="password" placeholder="비밀번호" style="width:100%"><button onclick="login()" style="width:100%">로그인</button><p id="err" class="muted"></p></section>
<div id="app" class="hidden"><div class="row"><div class="card"><div class="muted">활성 회원</div><div id="total" class="stat">-</div></div><div class="card"><div class="muted">오늘 아침 출석</div><div id="today" class="stat">-</div></div><div class="card"><div class="muted">이번 달 최다 출석</div><div id="top" class="stat">-</div></div></div>
<div class="card"><h3>아침 출석 달력</h3><div class="row"><button onclick="shift(-1)">이전 달</button><strong id="month"></strong><button onclick="shift(1)">다음 달</button></div><div id="calendar"></div></div><div class="card"><h3>선택한 날짜 출석자</h3><div id="attendees">날짜를 선택하세요.</div></div><button onclick="logout()">로그아웃</button></div></main><script>
const API="https://script.google.com/macros/s/AKfycbz2k8Dw34vL5mKCmOoqiThpm37r8tbRAIriJGhGxd7f4A2-JMRezG-p21inEtBbhltK/exec";let session=localStorage.getItem("wm_session")||"";
function call(method,params={}){return new Promise((resolve,reject)=>{const cb="wmcb"+Date.now()+Math.floor(Math.random()*9999),s=document.createElement("script");let timer=setTimeout(()=>{clean();reject(Error("서버 응답 시간 초과"))},20000);function clean(){clearTimeout(timer);delete window[cb];s.remove()}window[cb]=r=>{clean();if(r.ok)resolve(r.data);else reject(Error(r.message||"요청 실패"))};s.onerror=()=>{clean();reject(Error("서버 연결 실패"))};s.src=API+"?action=api&method="+encodeURIComponent(method)+"&callback="+cb+"&"+new URLSearchParams(params);document.body.appendChild(s)})}
async function login(){try{const r=await call("login",{password:document.querySelector("#pw").value});session=r.token;localStorage.setItem("wm_session",session);show()}catch(e){document.querySelector("#err").textContent=e.message}}
function show(){document.querySelector("#login").classList.add("hidden");document.querySelector("#app").classList.remove("hidden");init()}
function req(m,p={}){return call(m,{...p,session})}
function logout(){localStorage.removeItem("wm_session");location.reload()}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
if(session)show();if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js");

let yy=new Date().getFullYear(),mm=new Date().getMonth()+1;
async function init(){try{const s=await req("summary");total.textContent=s.totalMembers;today.textContent=s.todayCount+"명";top.textContent=s.topName+" ("+s.topCount+"회)";await draw()}catch(e){alert(e.message)}}
async function draw(){const d=await req("calendar",{year:yy,month:mm});month.textContent=yy+"년 "+mm+"월";const first=new Date(yy,mm-1,1).getDay(),last=new Date(yy,mm,0).getDate();let h="<table><tr>"+["일","월","화","수","목","금","토"].map(x=>"<th>"+x+"</th>").join("")+"</tr>";let day=1;for(let w=0;w<6&&day<=last;w++){h+="<tr>";for(let k=0;k<7;k++){if((w===0&&k<first)||day>last)h+="<td></td>";else{const ds=yy+"-"+String(mm).padStart(2,"0")+"-"+String(day).padStart(2,"0"),a=d.attendance[ds];h+=`<td onclick="pick('${ds}')" style="cursor:pointer"><b>${day}</b><br><small>${a?("출석 "+a.count):""}</small></td>`;day++}}h+="</tr>"}calendar.innerHTML=h+"</table>"}
function shift(n){mm+=n;if(mm<1){mm=12;yy--}if(mm>12){mm=1;yy++}draw()}
async function pick(ds){try{const a=await req("attendees",{date:ds});attendees.textContent=a.length?a.join(", "):"출석자가 없습니다."}catch(e){attendees.textContent=e.message}}
</script></body></html>
